<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Go2W 遥控与状态</title>
<style>body{background:#111c28;color:#ecf4fa;font:18px system-ui;max-width:950px;margin:24px auto;padding:12px}button{background:#28455c;color:white;border:2px solid #56778e;border-radius:12px;padding:18px;margin:6px;font-size:20px;touch-action:none;user-select:none}button.on{background:#087e65}#stop{background:#8c3346}.card{background:#1c2c3b;padding:20px;border-radius:15px;margin:15px 0}#live{font-size:25px;line-height:1.8;white-space:pre-line}#ack{color:#67dfbd}pre{white-space:pre-wrap}#zone{outline:2px solid #67dfbd;padding:15px}</style>
<h1>Go2W 三通道遥控与状态</h1><p>W/S前后，A/D横移，Q/E整体转向；机身yaw水平坐标系。M 切换抬腿/轮驱，K 切换高/低速（上限减半、加速度不变）。</p>
<div class="card" id="live">连接状态服务中…</div><div id="ack">尚未发送输入</div>
<div class="card" id="zone" tabindex="0">虚拟键盘：按住运动键加速，松开按制动加速度减速；失焦/紧急释放立即清零参考。也可点击此区域后用实体键盘。
<div><button data-key="W">W 前进</button><button data-key="S">S 后退</button><button data-key="A">A 左移</button><button data-key="D">D 右移</button><button data-key="Q">Q 左转</button><button data-key="E">E 右转</button></div>
<div><button data-key="H">H 倒立</button><button data-key="P">P 趴下</button><button data-key="U">U 起立</button><button data-key="M">M 抬腿/轮驱</button><button data-key="K">K 高/低速</button><button id="stop">释放全部</button></div></div>
<p>切换窗口、失焦或关闭页面会释放按键。网络中断后服务器在0.4秒输入超时后的控制更新清零。</p><details><summary>完整状态</summary><pre id="raw"></pre></details>
<script>
const held=new Set(),session=crypto.randomUUID(),zone=document.querySelector('#zone');let chain=Promise.resolve(),busy=false,epoch=0;
function paint(){document.querySelectorAll('[data-key]').forEach(b=>b.classList.toggle('on',held.has(b.dataset.key)))}
function send(){const keys=[...held],generation=epoch;chain=chain.catch(()=>{}).then(async()=>{if(generation!==epoch)return;const r=await fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,keys})});document.querySelector('#ack').textContent=r.ok?'服务器已接收：'+(keys.join(' + ')||'松键制动'):'输入被拒绝：另一个来源正在控制';}).catch(()=>document.querySelector('#ack').textContent='发送失败，等待超时清零');return chain;}
function release(){held.clear();epoch++;paint();chain=chain.catch(()=>{}).then(()=>fetch('/release',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session})})).catch(()=>{});document.querySelector('#ack').textContent='紧急释放/失焦：撤销输入并立即清零参考'}
document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(b.dataset.key);paint();send()};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(held.delete(b.dataset.key)){paint();send()}})});
zone.onkeydown=e=>{let k=e.key.toUpperCase();if(k.length===1&&'WASDQEHPUMK'.includes(k)){e.preventDefault();if(!held.has(k)){held.add(k);paint();send()}}};zone.onkeyup=e=>{if(held.delete(e.key.toUpperCase())){paint();send()}};
window.onblur=release;window.onpagehide=()=>{held.clear();epoch++;navigator.sendBeacon('/release',JSON.stringify({session}))};document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});document.querySelector('#stop').onclick=release;
setInterval(()=>{if(document.hasFocus()&&!document.hidden&&held.size&&!busy){busy=true;send().finally(()=>busy=false)}},100);
setInterval(async()=>{try{const s=await(await fetch('/status')).json(),p=s.physics,c=s.command_m_s_rad_s,a=s.acceleration_m_s2_rad_s2,actual=s.actual_velocity_yaw_m_s_rad_s;document.querySelector('#live').textContent=`当前模式：${s.mobility_profile} / ${s.speed_mode} ｜ 前进上限 ${s.command_limits.max_forward_m_s} m/s ｜ 转向上限 ±${s.command_limits.current_yaw_rad_s.toFixed(2)} rad/s（零平移 ${s.command_limits.max_yaw_rad_s}）\n状态：${s.mode} ｜ 按键：${s.keys.join(' ')||'无'}\n参考 vx/vy/wz：${c.map(v=>v.toFixed(3)).join(' / ')}\n加速度 ax/ay/alpha：${a.map(v=>v.toFixed(3)).join(' / ')}\n实际（仿真真值）：${actual?actual.map(v=>v.toFixed(3)).join(' / '):'等待'}\n航向误差：${s.heading_error_rad===null?'等待':s.heading_error_rad.toFixed(3)} rad\n输入状态：${s.input_state} ｜ 策略：${s.policy_path}\n反馈：${s.message}\n输入包 ${s.stats.input_packets||0} ｜ 仿真 ${p.sim_s||0}s`;document.querySelector('#raw').textContent=JSON.stringify(s,null,2)}catch(e){document.querySelector('#live').textContent='状态连接中断；请检查 SSH 隧道'}} ,200);
</script></html>
